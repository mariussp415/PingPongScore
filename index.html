<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0d10">

  <!-- Gjør den mer app-aktig på iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="PingScore">

  <title>PingScore</title>

  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

  <main class="app">

    <!-- TITTEL -->
    <h1>🏓 PingScore</h1>

    <!-- SETT -->
    <div class="sets">
      Sett:
      <span id="sets1">0</span>
      <span>–</span>
      <span id="sets2">0</span>
    </div>

    <!-- SCORE -->
    <div class="scoreboard">

      <!-- SPILLER 1 -->
      <div class="player">
        <p>Spiller 1</p>

        <div id="score1" class="score">
          0
        </div>

        <button
          class="point-button"
          onclick="addPoint(1)"
          aria-label="Poeng til spiller 1"
        >
          +
        </button>
      </div>

      <!-- SKILLE -->
      <div class="divider">
        –
      </div>

      <!-- SPILLER 2 -->
      <div class="player">
        <p>Spiller 2</p>

        <div id="score2" class="score">
          0
        </div>

        <button
          class="point-button"
          onclick="addPoint(2)"
          aria-label="Poeng til spiller 2"
        >
          +
        </button>
      </div>

    </div>

    <!-- MIKROFON -->
    <button
      id="listenButton"
      class="listen-button"
    >
      🎙️ Start lytting
    </button>

    <!-- STATUS / HVA DEN HØRTE -->
    <p id="status">
      Si stillingen, for eksempel «tre to»
    </p>

    <!-- KONTROLLER -->
    <div class="controls">

      <button onclick="undo()">
        ↶ Angre
      </button>

      <button onclick="resetGame()">
        Ny kamp
      </button>

    </div>

  </main>

 <link rel="stylesheet" href="style.css?v=5">
<script src="app.js?v=9"></script>

</body>
</html>
