<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0d10">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="PingScore">

  <title>PingScore</title>

  <link rel="stylesheet" href="style.css?v=10">
</head>

<body>

  <main class="app">

    <header class="topbar">
      <h1>🏓 PingScore</h1>

      <div class="match-setting">
        <label for="setsToWin">Først til</label>

        <select id="setsToWin">
          <option value="3">3 sett</option>
          <option value="4">4 sett</option>
          <option value="5" selected>5 sett</option>
        </select>
      </div>
    </header>


    <!-- SPILLERNAVN -->
    <div class="name-row">

      <input
        id="player1NameInput"
        type="text"
        value="Marius"
        maxlength="15"
      >

      <span class="vs">VS</span>

      <input
        id="player2NameInput"
        type="text"
        value="Petter"
        maxlength="15"
      >

    </div>


    <!-- SETT -->
    <div class="sets">
      <span id="player1Label">Marius</span>

      <strong id="sets1">0</strong>

      <span>–</span>

      <strong id="sets2">0</strong>

      <span id="player2Label">Petter</span>
    </div>


    <!-- SETTHISTORIKK -->
    <div
      id="setHistory"
      class="set-history"
    >
      <span class="history-empty">
        Ingen sett ferdig ennå
      </span>
    </div>


    <!-- SCORE -->
    <div class="scoreboard">

      <div class="player">

        <p id="scorePlayer1Name">
          Marius
        </p>

        <div
          id="score1"
          class="score"
        >
          0
        </div>

        <button
          class="point-button"
          onclick="addPoint(1)"
        >
          +
        </button>

      </div>


      <div class="divider">
        –
      </div>


      <div class="player">

        <p id="scorePlayer2Name">
          Petter
        </p>

        <div
          id="score2"
          class="score"
        >
          0
        </div>

        <button
          class="point-button"
          onclick="addPoint(2)"
        >
          +
        </button>

      </div>

    </div>


    <!-- MIKROFON -->
    <button
      id="listenButton"
      class="listen-button"
    >
      🎙️ Start lytting
    </button>


    <p id="status">
      Si scoren, f.eks. «tre to»
    </p>


    <div class="controls">

      <button onclick="undo()">
        ↶ Angre
      </button>

      <button onclick="resetGame()">
        Ny kamp
      </button>

    </div>

  </main>


<script src="app.js?v=12"></script>

</body>
</html>
